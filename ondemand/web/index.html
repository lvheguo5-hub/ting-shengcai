<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <title>有人听 · 按需</title>
  <link rel="stylesheet" href="/styles.css?v=10" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">有人听 <span class="badge">按需</span></div>
      <div class="top-right">
        <button type="button" id="btn-playlist" class="playlist-entry">待听 (0)</button>
        <a class="offline-link" href="http://127.0.0.1:8765/" target="_blank" rel="noopener">亦仁离线合集仍在 :8765</a>
      </div>
    </header>

    <main id="view-home" class="view">
      <h1>搜作者或标题</h1>
      <form id="search-form" class="search-row">
        <input id="q" type="search" enterkeyhint="search" autocomplete="off"
               placeholder="搜作者或标题，如清水、亦仁" />
        <button type="submit">搜索</button>
      </form>
      <div class="chips">
        <button type="button" class="chip chip-browse" data-browse="hot">热门榜</button>
        <button type="button" class="chip chip-browse" data-browse="digested">精华帖</button>
        <button type="button" class="chip" data-q="刘小排">刘小排</button>
        <button type="button" class="chip" data-q="亦仁">亦仁</button>
      </div>
      <p class="hint">正文与语音按需拉取并缓存，不预生成全站音频。</p>
      <p class="hint">加入待听后后台缓存，可连播。</p>
    </main>

    <main id="view-results" class="view hidden">
      <button type="button" class="back" id="back-home">← 返回搜索</button>
      <p id="results-status" class="hint hidden">加载中…</p>
      <section id="authors-section">
        <h2>作者</h2>
        <div id="authors" class="cards"></div>
      </section>
      <section>
        <h2 id="topics-heading">标题</h2>
        <ul id="topics" class="topic-list"></ul>
        <div id="pager" class="pager hidden">
          <button type="button" id="pager-prev" class="btn-secondary">上一页</button>
          <span id="pager-label" class="pager-label">第 1 页</span>
          <button type="button" id="pager-next" class="btn-secondary">下一页</button>
        </div>
      </section>
    </main>

    <main id="view-reader" class="view hidden">
      <button type="button" class="back" id="back-results">← 返回列表</button>
      <article class="reader">
        <h1 id="r-title"></h1>
        <p class="meta" id="r-meta"></p>
        <div class="reader-actions">
          <button type="button" id="btn-add-queue" class="btn-secondary">加入待听</button>
        </div>
        <div id="r-body" class="body"></div>
        <p id="r-empty" class="empty hidden">正文尚未缓存</p>
      </article>
      <div class="player-bar sticky" id="player-bar">
        <button type="button" id="btn-tts" class="tts">生成/播放语音</button>
        <div class="player-title" id="player-title">未选择曲目</div>
        <div class="seek-row">
          <span class="time" id="cur">0:00</span>
          <input type="range" id="seek" min="0" max="0" value="0" step="0.1" disabled aria-label="进度" />
          <span class="time" id="dur">0:00</span>
        </div>
        <div class="controls">
          <button type="button" id="btn-prev" class="ctrl" aria-label="上一首" disabled>⏮</button>
          <button type="button" id="btn-play" class="ctrl play" aria-label="播放" disabled>▶</button>
          <button type="button" id="btn-next" class="ctrl" aria-label="下一首" disabled>⏭</button>
          <button type="button" id="btn-rate" class="ctrl rate" aria-label="倍速">1x</button>
        </div>
        <audio id="audio" preload="none"></audio>
      </div>
    </main>

    <main id="view-playlist" class="view hidden">
      <button type="button" class="back" id="back-from-playlist">← 返回</button>
      <div class="pl-header">
        <h1>待听 / 播放列表</h1>
        <div class="pl-toolbar">
          <button type="button" id="pl-prepare-all" class="btn-secondary">全部准备</button>
          <button type="button" id="pl-clear" class="btn-danger">清空</button>
        </div>
      </div>
      <ul id="playlist-items" class="playlist-list"></ul>
      <p id="pl-empty" class="hint">暂无待听。在标题列表或正文页点「加入待听」。</p>
      <div class="player-bar sticky" id="pl-player-bar">
        <div class="player-title" id="pl-now">未在播放</div>
        <div class="seek-row">
          <span class="time" id="pl-cur">0:00</span>
          <input type="range" id="pl-seek" min="0" max="0" value="0" step="0.1" disabled aria-label="进度" />
          <span class="time" id="pl-dur">0:00</span>
        </div>
        <div class="controls">
          <button type="button" id="pl-prev" class="ctrl" aria-label="上一首">⏮</button>
          <button type="button" id="pl-play" class="ctrl play" aria-label="播放" disabled>▶</button>
          <button type="button" id="pl-next" class="ctrl" aria-label="下一首">⏭</button>
          <button type="button" id="pl-btn-rate" class="ctrl rate" aria-label="倍速">1x</button>
        </div>
        <audio id="pl-audio" preload="none"></audio>
      </div>
    </main>
  </div>
  <script src="/app.js?v=10"></script>
</body>
</html>
