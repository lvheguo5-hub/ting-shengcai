<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <title>有人听 · 有声书架</title>
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>
  <div id="app">
    <section id="view-home" class="view">
      <header class="topbar">
        <h1>书架</h1>
        <p class="subtitle">有人听 · 本地合集</p>
      </header>

      <div class="banner note-banner" role="note">
        本合集已跳过视频/强图/招聘
      </div>

      <div class="author-grid" id="author-grid">
        <button type="button" class="author-card active" data-author="yiren" aria-label="打开亦仁播放列表">
          <div class="avatar yiren">亦</div>
          <div class="author-meta">
            <span class="author-name">亦仁</span>
            <span class="author-count">12 篇 · 可播放</span>
          </div>
          <span class="chevron" aria-hidden="true">›</span>
        </button>

        <button type="button" class="author-card disabled" disabled aria-disabled="true">
          <div class="avatar muted">刘</div>
          <div class="author-meta">
            <span class="author-name">刘小排</span>
            <span class="badge">即将支持</span>
          </div>
        </button>

        <button type="button" class="author-card disabled" disabled aria-disabled="true">
          <div class="avatar muted">杨</div>
          <div class="author-meta">
            <span class="author-name">杨涛</span>
            <span class="badge">即将支持</span>
          </div>
        </button>
      </div>
    </section>

    <section id="view-playlist" class="view hidden">
      <header class="topbar">
        <button type="button" class="back-btn" id="btn-back" aria-label="返回书架">‹</button>
        <div class="topbar-text">
          <h1>亦仁</h1>
          <p class="subtitle">12 轨连续播放</p>
        </div>
      </header>

      <div class="banner note-banner" role="note">
        本合集已跳过视频/强图/招聘
      </div>

      <div class="search-row">
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="搜索标题…"
          enterkeyhint="search"
          autocomplete="off"
          aria-label="搜索标题"
        />
        <button type="button" id="btn-clear-search" class="search-clear" hidden aria-label="清除搜索">清除</button>
      </div>
      <p id="search-empty" class="search-empty hidden">没有匹配的标题</p>

      <ul class="track-list" id="track-list" role="list"></ul>
    </section>
  </div>

  <footer id="player-bar" class="player-bar" hidden>
    <div class="player-title" id="player-title">未选择曲目</div>
    <div class="seek-row">
      <span class="time" id="time-current">0:00</span>
      <input type="range" id="seek" min="0" max="0" step="0.1" value="0" aria-label="进度" />
      <span class="time" id="time-duration">0:00</span>
    </div>
    <div class="controls">
      <button type="button" id="btn-prev" class="ctrl" aria-label="上一首">⏮</button>
      <button type="button" id="btn-play" class="ctrl play" aria-label="播放">▶</button>
      <button type="button" id="btn-next" class="ctrl" aria-label="下一首">⏭</button>
      <button type="button" id="btn-rate" class="ctrl rate" aria-label="倍速">1x</button>
    </div>
  </footer>

  <audio id="audio" preload="metadata"></audio>
  <script src="app.js?v=2"></script>
</body>
</html>
